# =========================================================
# DimArch OS — Hyprlock
# Lock screen
# =========================================================

general {
    # Keep cursor visible while tuning the lock screen.
    # Later you can switch this to true if you want cleaner look.
    hide_cursor = false

    # Critical:
    # Empty Enter should NOT count as a failed password attempt.
    ignore_empty_input = true

    # Render widgets immediately.
    immediate_render = true

    # Default auto mode for fractional scaling.
    # Good for DP-1 scale 1.5 + DP-2 scale 1.
    fractional_scaling = 2
}

# ---------------------------------------------------------
# Auth
# ---------------------------------------------------------

auth {
    # Use PAM auth through /etc/pam.d/hyprlock.
    pam:enabled = true
    pam:module = hyprlock
}

# ---------------------------------------------------------
# Background
# ---------------------------------------------------------

background {
    # Empty monitor = all monitors.
    monitor =

    # Use your DimArch/Hyprland wallpaper.
    path = ~/Pictures/wallpapers/hyprland.png

    # Clean blurred background.
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.0
    brightness = 0.82
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ---------------------------------------------------------
# Time
# ---------------------------------------------------------

label {
    monitor =
    text = $TIME
    font_family = Inter Variable
    font_size = 64
    color = rgba(ffffffee)

    position = 0, 130
    halign = center
    valign = center
}

# ---------------------------------------------------------
# Date
# ---------------------------------------------------------

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = Inter Variable
    font_size = 18
    color = rgba(ffffffcc)

    position = 0, 70
    halign = center
    valign = center
}

# ---------------------------------------------------------
# Password field
# ---------------------------------------------------------

input-field {
    monitor =

    size = 340, 56
    position = 0, -45
    halign = center
    valign = center

    # Shape
    rounding = 14
    outline_thickness = 1

    # Password dots
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true

    # Colors
    outer_color = rgba(ffffff44)
    inner_color = rgba(00000033)
    font_color = rgba(ffffffff)

    # Keep field visible even when empty.
    fade_on_empty = false

    # Text
    placeholder_text = <span foreground="##ffffff99">Password</span>

    # Feedback colors
    check_color = rgba(2f7d68ff)
    fail_color = rgba(d65d5dff)
}

# ---------------------------------------------------------
# Keyboard layout indicator
# ---------------------------------------------------------

label {
    monitor =

    # $LAYOUT is provided by hyprlock.
    # It shows current keyboard layout.
    text = Layout: $LAYOUT

    font_family = Inter Variable
    font_size = 14
    color = rgba(ffffffaa)

    position = 0, -105
    halign = center
    valign = center
}

# ---------------------------------------------------------
# Failed attempts / PAM feedback
# ---------------------------------------------------------

label {
    monitor =

    # $FAIL shows failure message.
    # $ATTEMPTS shows number of failed attempts.
    text = $FAIL $ATTEMPTS

    font_family = Inter Variable
    font_size = 14
    color = rgba(d65d5dcc)

    position = 0, -145
    halign = center
    valign = center
}
