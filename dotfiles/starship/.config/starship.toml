"$schema" = 'https://starship.rs/config-schema.json'

# ════════════════════════════════════════════════════════════════
#  DimArch OS — Starship Prompt Config
#  Theme: DimArch Sage
#
#  Формат зеркалит mac-setup (рамка ╭─/╰────, блок времени без
#  стрелки), символ os — арчевый. Языковые модули настроены, но
#  намеренно НЕ выводятся: они единственные, кому нужен скан
#  содержимого каталога, из-за которого первый промпт после
#  ребута ловил scan_timeout на холодном dentry-кэше.
# ════════════════════════════════════════════════════════════════

format = """
[╭─](frame) $os$directory$git_branch$git_status$cmd_duration
[╰────](frame)$time$character"""

palette = "dimarch_sage"

[os]
disabled = false
style = "bold sage"

[os.symbols]
Linux = "󰌽 "
Arch = " "

[directory]
# role.file.directory — sage отмечает каталог как состояние, а не категорию.
style = "bold sage"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bold clay"

[git_branch]
# role.git.branch — sage_br, самое светлое в промпте: рядом с каталогом
# более тёмный тир от него физически неотличим.
style = "bold sage_br"

[git_status]
# role.git.modified — ochre: «изменение, внимание без тревоги». Красный
# здесь был бы clay, а он зарезервирован под реальный отказ.
style = "bold ochre"
untracked = '?${count}'
modified = '!${count}'
staged = '+${count}'
deleted = '✘${count}'
renamed = '»${count}'
conflicted = '=${count}'
stashed = '$${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'

[cmd_duration]
min_time = 2000
style = "bold recede"
format = '[ $duration]($style) '

[time]
disabled = false
format = '[ $time ](bold bg:sage_dim fg:sage_br)[](fg:sage_dim)'
time_format = "%H:%M"

[character]
success_symbol = ""
error_symbol = " [✗](bold clay)"

# ── Языковые модули: стили заданы, в format не выводятся ──────────────────────
[nodejs]
symbol = " "
style = "bold lichen"

[python]
symbol = " "
style = "bold patina"
pyenv_version_name = true

[rust]
symbol = " "
style = "bold ochre_br"

[palettes.dimarch_sage]
# Значения резолвятся из dimarch-theme/colors/palette.json v3.0.0 через карту
# компонентов (`palette component starship`). Ни один цвет здесь не изобретается.
bg        = "#1d2121"  # surface.terminal.lift
overlay   = "#324040"  # surface.terminal.border
frame     = "#5b8f78"  # ramp.sage.dim — рамка промпта
text      = "#edeae4"  # neutral.primary
subtext   = "#c8c4be"  # neutral.secondary
muted     = "#82828c"  # neutral.muted
recede    = "#8a9d93"  # neutral.recede
sage      = "#7fb89e"  # ramp.sage.base
sage_br   = "#c4ddd2"  # role.git.branch
sage_dim  = "#2d4a40"  # ramp.sage_deep.tint
clay      = "#d96c6c"  # ramp.clay.base
ochre     = "#d4a96a"  # ramp.ochre.base
ochre_br  = "#e4ba7a"  # ramp.ochre.bright
lichen    = "#91b06d"  # ramp.lichen.base
patina    = "#40c9c0"  # ramp.patina.bright
