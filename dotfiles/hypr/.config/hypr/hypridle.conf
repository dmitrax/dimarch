# =========================================================
# DimArch OS — Hypridle
# Idle / lock / monitor off / delayed suspend / restore
# Hyprland v0.55+
# =========================================================

general {
    # Lock command.
    # Forces EN layout before starting hyprlock.
    # With kb_layout = "us,ru":
    #   0 = us
    #   1 = ru
    lock_cmd = pidof hyprlock || sh -c 'hyprctl switchxkblayout all 0 >/dev/null 2>&1; hyprlock'

    # Before real suspend:
    # 1. save current floating window geometry
    # 2. lock session
    before_sleep_cmd = sh -c '~/.config/hypr/scripts/save-before-sleep.sh; loginctl lock-session'

    # After real resume from suspend:
    # 1. ensure monitors are on
    # 2. restore monitor layout and exact floating window geometry
    after_sleep_cmd = sh -c 'wlopm --on "*" 2>/dev/null || true; ~/.config/hypr/scripts/restore-after-resume.sh'

    # Respect app/media/screen-share inhibitors.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false

    # Wait until the session is locked before sleeping.
    inhibit_sleep = 3
}

# ---------------------------------------------------------
# 5 minutes idle → lock screen
# Then schedule suspend 5 minutes later.
#
# Total:
#   5:00  → lock
#   10:00 → suspend
#
# Any user activity after lock cancels the scheduled suspend.
# ---------------------------------------------------------
listener {
    timeout = 300

    on-timeout = sh -c 'loginctl lock-session; systemd-run --user --unit=dimarch-idle-suspend --collect --on-active=20min /usr/bin/systemctl suspend'

    on-resume = sh -c 'systemctl --user stop dimarch-idle-suspend.timer dimarch-idle-suspend.service 2>/dev/null || true'
}

# ---------------------------------------------------------
# 5 min 45 sec idle → turn monitors off via wlopm
#
# Important:
# This is NOT suspend, so after_sleep_cmd does not run here.
# Therefore we must save before wlopm off and restore on listener resume.
# ---------------------------------------------------------
listener {
    timeout = 420

    on-timeout = sh -c '~/.config/hypr/scripts/save-before-sleep.sh; wlopm --off "*"'

    on-resume = sh -c 'wlopm --on "*" 2>/dev/null || true; ~/.config/hypr/scripts/restore-after-resume.sh'
}
