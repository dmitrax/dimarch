# DimArch mpv profile
# Philosophy: minimal, Wayland-native, no GTK/Qt wrapper (see
# decision-mpv-instead-of-celluloid-because-gtk-tail.md).

vo=gpu-next
gpu-context=wayland
ao=pipewire

# RX 580 (Polaris) uses the older UVD decode block, not VCN — mpv 0.41+
# prefers Vulkan video decode over VAAPI by default, and it's unconfirmed
# whether RADV's Vulkan-video path covers UVD-era hardware. auto-safe lets
# mpv fall back safely instead of forcing a backend that might not exist
# on this GPU. If you see artifacts/stutter, this is the first thing to check.
hwdec=auto-safe

# Keep video viewer behavior sane on mixed-DPI / 4K (DP-1 LG 4K + DP-2 Dell FullHD).
autofit-larger=90%x90%
keepaspect-window=yes
auto-window-resize=yes

# Viewer ergonomics.
keep-open=yes
# NOT save-position-on-quit: per mpv's own docs (RESUMING PLAYBACK section),
# this option saves the CURRENT position on every quit unconditionally, with
# no exception for files already watched to the end — combined with
# keep-open=yes (which pauses on the last frame instead of closing), this
# meant reopening a short clip after watching it through always resumed
# stuck at/near the end instead of starting over. Confirmed live 2026-07-09.
# `Shift+Q` (quit-watch-later, mpv default bind) remains available for the
# rare case of actually wanting to resume a long video later.
# NOT force-window=immediate: that opens a placeholder window before mpv
# knows the real video dimensions, which hits an open Hyprland bug (window
# rules / first-commit desired-geometry not respected — see
# github.com/hyprwm/Hyprland/discussions/12595) and gets the window stuck
# at a wrong size for the rest of its life, ignoring autofit-larger
# entirely. force-window=yes waits until real dimensions are known before
# creating the window, sidestepping the bug — confirmed live 2026-07-09 on
# both a landscape (1920x958 -> 1728x862) and portrait (608x1080 -> 547x972)
# test file, both correctly autofit-larger-capped per their own aspect ratio.
force-window=yes
# uosc's `autohide=yes` ties the ENTIRE OSD (top bar, controls, timeline —
# all of it, not just per-element proximity fade) to this timer: once the
# cursor auto-hides, uosc hides everything with it, regardless of any
# `*_persistency` setting. 1000ms was too aggressive — the UI could vanish
# before you'd even moved the mouse to the button you wanted. Raised to
# 3000ms per explicit ask. Confirmed live 2026-07-09 this was the actual
# cause of several "nothing renders" moments during testing, not proximity.
cursor-autohide=3000
stop-screensaver=yes

# Built-in OSC disabled in favor of uosc (mpv-uosc, from chaotic-aur — see
# decision-chaotic-aur-as-accepted-package-source note). Confirmed live
# 2026-07-09: the built-in osc.lua's documented color options
# (buttons_color/timecode_color/title_color/background_color) do NOT
# actually apply to most bottombar-layout elements in this mpv version —
# only time_pos_color worked, verified via a real screenshot (grim), not
# guessed. uosc's color= theming is real and complete (see
# script-opts/uosc.conf), and it respects osd-font below automatically.
osc=no
osd-bar=no
border=no

# OSD/subtitle text styling — Sage terminal-surface palette + font, same as
# swayimg/uosc. The border color is a text OUTLINE for legibility over
# arbitrary video, not a panel background; it tracks the surface tone anyway
# so all three files stay on one value (resynced #16161c → #171a1b 2026-07-26).
osd-font="Inter Variable"
osd-color="#edeae4"
osd-border-color="#171a1b"
sub-font="Inter Variable"
sub-color="#edeae4"
sub-border-color="#171a1b"
