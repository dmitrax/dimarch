# =========================================================
# DimArch OS — yazi theme.toml (Sage)
# Shares ghostty's ANSI colors — yazi belongs to the terminal surface family,
# not to the translucent chrome family (rofi/swaync/swayosd), which sits on a
# different base tone. An earlier header listed both as one palette, and
# called the two values below "bg" even though this file sets no background
# at all (see the note further down):
#   on-accent  #12141a   dark text drawn ON sage/amber fills
#   fill-alt   #1d2121   secondary chip fill (inactive tab, mode chips)
#   accent (sage) #7fb89e
#   text    #edeae4             text-secondary #c8c4be
#   text-muted #82828c          border  #324040
#   danger  #d96c6c             warn (yellow) #d4a96a
#
# Rebuilt 2026-07-26 onto the role map in dimarch-theme/colors/palette.json.
# The split that governs every value here: SAGE marks state (directories,
# active pick, hovered task, git added, normal mode), ACCENTS mark category
# (file type, git status). That is why directories moved off blue onto sage
# and executables onto lichen — a directory is somewhere you go, an
# executable is a kind of thing.
# Media split in two: video -> heather.bright, audio -> ochre.bright. They had
# shared one colour, so an album folder and a film folder looked identical.
# Borders left the cold band: #3a3a4a was hue 240, replaced by #324040 at the
# same visibility (contrast to the terminal ground 1.56 -> 1.61).
# Deliberately does not set a background anywhere — Ghostty's
# own translucent/blurred background (background-opacity=0.85)
# must stay visible through yazi, the same way it does for
# every other terminal app. Only fg/accent colors are themed.
# Anything not listed here inherits from yazi's bundled
# theme-dark.toml (icons, filetype fallback colors, etc.).
# =========================================================

#:schema https://yazi-rs.github.io/schemas/theme.json

[mgr]
cwd = { fg = "#7fb89e" }

find_keyword  = { fg = "#e4ba7a", bold = true, italic = true, underline = true }
find_position = { fg = "#c4ddd2", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "#7fb8b4", italic = true }

marker_copied   = { fg = "#8fccc8", bg = "#8fccc8" }
marker_cut      = { fg = "#e49393", bg = "#e49393" }
marker_marked   = { fg = "#cd98af", bg = "#cd98af" }
marker_selected = { fg = "#e4ba7a", bg = "#e4ba7a" }
marker_symbol   = "│"

count_copied   = { fg = "#12141a", bg = "#7fb89e" }
count_cut      = { fg = "#edeae4", bg = "#d96c6c" }
count_selected = { fg = "#12141a", bg = "#d4a96a" }

border_symbol = "│"
border_style  = { fg = "#324040" }

[tabs]
active   = { fg = "#12141a", bg = "#7fb89e", bold = true }
inactive = { fg = "#82828c", bg = "#1d2121" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#12141a", bg = "#7fb89e", bold = true }
normal_alt  = { fg = "#7fb89e", bg = "#1d2121" }

select_main = { fg = "#12141a", bg = "#d4a96a", bold = true }
select_alt  = { fg = "#d4a96a", bg = "#1d2121" }

unset_main = { fg = "#edeae4", bg = "#d96c6c", bold = true }
unset_alt  = { fg = "#d96c6c", bg = "#1d2121" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep  = { fg = "#324040" }
perm_type  = { fg = "#7fb89e" }
perm_read  = { fg = "#e4ba7a" }
perm_write = { fg = "#e49393" }
perm_exec  = { fg = "#91b06d" }

progress_label  = { bold = true }
progress_normal = { fg = "#7fb89e", bg = "#1d2121" }
progress_error  = { fg = "#edeae4", bg = "#d96c6c" }

[which]
mask            = { bg = "#12141a" }
cand            = { fg = "#8fccc8" }
rest            = { fg = "#82828c" }
desc            = { fg = "#98c2af" }
separator_style = { fg = "#82828c" }

[confirm]
border  = { fg = "#7fb89e" }
title   = { fg = "#7fb89e" }
btn_yes = { fg = "#12141a", bg = "#7fb89e", bold = true }
btn_no  = { fg = "#82828c" }

[spot]
border   = { fg = "#7fb89e" }
title    = { fg = "#7fb89e" }
tbl_col  = { fg = "#7fb8b4" }
tbl_cell = { fg = "#12141a", bg = "#e4ba7a" }

[notify]
title_info  = { fg = "#7fb89e" }
title_warn  = { fg = "#d4a96a" }
title_error = { fg = "#d96c6c" }

[pick]
border = { fg = "#7fb89e" }
active = { fg = "#c4ddd2", bold = true }

[input]
border = { fg = "#7fb89e" }

[cmp]
border = { fg = "#7fb89e" }

[tasks]
border  = { fg = "#7fb89e" }
hovered = { fg = "#c4ddd2", bold = true }

[help]
border = { fg = "#7fb89e" }
chord  = { fg = "#8fccc8" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#b87a95" },
	{ mime = "video/*", fg = "#cd98af" },
	{ mime = "audio/*", fg = "#e4ba7a" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d4a96a" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#8fccc8" },
	{ mime = "vfs/{absent,stale}", fg = "#82828c" },

	{ url = "*", is = "orphan", bg = "#d96c6c" },
	{ url = "*", is = "exec"  , fg = "#91b06d" },

	{ url = "*", is = "dummy", bg = "#d96c6c" },
	{ url = "*/", is = "dummy", bg = "#d96c6c" },

	{ url = "*/", fg = "#7fb89e" },
]

# ── Icons ───────────────────────────────────────────────────────
# Yazi ships default icon colours compiled into the binary, and they are
# Material Design values with no relation to this palette — `dir` is
# #03a9f4 (the light blue that made folders look un-themed), `exec`
# #8bc34a, the device/pipe family #cddc39. Only the COLOURS are overridden
# below; every glyph is the upstream default, so icons look unchanged.
# Roles follow the same split as everything else: a directory is a place
# you go (sage, state), an executable is a kind of thing (lichen, category).
# `dirs`/`exts`/`globs` are deliberately NOT touched — those carry per-name
# icons (.git, Downloads, tsconfig.json) that are genuinely useful for
# navigation, and overriding them would mean re-listing hundreds of entries.
[icon]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#d96c6c" },
	{ if = "link",   text = "", fg = "#7fb8b4" },
	{ if = "block",  text = "", fg = "#82828c" },
	{ if = "char",   text = "", fg = "#82828c" },
	{ if = "fifo",   text = "", fg = "#82828c" },
	{ if = "sock",   text = "", fg = "#82828c" },
	{ if = "sticky", text = "", fg = "#82828c" },
	{ if = "dummy",  text = "", fg = "#d96c6c" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#c4ddd2" },
	{ if = "dir",           text = "", fg = "#7fb89e" },
	{ if = "exec",          text = "", fg = "#91b06d" },
	{ if = "!dir",          text = "", fg = "#c8c4be" },
]

# git.yazi — status colors, no custom sign glyphs (defaults are fine)
[git]
modified  = { fg = "#d4a96a" }
added     = { fg = "#7fb89e" }
untracked = { fg = "#b87a95" }
ignored   = { fg = "#82828c" }
deleted   = { fg = "#d96c6c", bold = true }
updated   = { fg = "#8fccc8" }
