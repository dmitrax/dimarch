# Мониторы — Dell слева, LG 4K справа
monitor = DP-2, 1920x1080@60, 0x0, 1
monitor = DP-1, 3840x2160@60, 1920x0, 1.5

# Автозапуск
exec-once = hyprpaper
exec-once = waybar

# Декорации
decoration {
    rounding = 12
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000033)
    }
}

# Анимации
animations {
    enabled = yes
    bezier = maclike, 0.25, 1, 0.5, 1
    animation = windows,    1, 4, maclike, slide
    animation = windowsOut, 1, 3, maclike, slide
    animation = fade,       1, 4, maclike
    animation = workspaces, 1, 5, maclike, slidevert
}

# Горячие клавиши
$mod = SUPER
bind = $mod, Return, exec, ghostty
bind = $mod, E,      exec, dolphin
bind = $mod, Space,  exec, rofi -show drun
bind = $mod, Q,      killactive
bind = $mod, F,      fullscreen
bind = $mod, L,      exec, hyprlock
bind = $mod, 1,      workspace, 1
bind = $mod, 2,      workspace, 2
bind = $mod, 3,      workspace, 3
bind = $mod, 4,      workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

# Мышь
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Window rules — новый синтаксис 0.53+
windowrule = match:class (.*), float on
# windowrule = match:class ^(rofi)$, no_border on
# windowrule = match:class ^(com.mitchellh.ghostty)$, no_border on

# Клавиатура
input {
    kb_layout = us,ru
    kb_options = grp:ctrl_shift_toggle
}
