# =========================================================
# DimArch OS — Hypridle
# Idle / lock / monitor off / suspend
# Hyprland v0.55+ (wlopm, never dpms)
# =========================================================

general {
    # Lock command.
    # Forces EN layout before starting hyprlock to avoid
    # getting stuck in RU layout on the lock screen.
    # With kb_layout = "us,ru":
    #   0 = us
    #   1 = ru
    lock_cmd = pidof hyprlock || sh -c 'hyprctl switchxkblayout all 0 >/dev/null 2>&1; hyprlock'

    # Before real suspend:
    # 1. save current floating window geometry
    # 2. lock session (always, regardless of caffeine state)
    #
    # Note: before_sleep_cmd fires on any PrepareForSleep signal
    # from systemd-logind — it is NOT subject to idle inhibitors.
    # This is intentional: the screen should always lock before sleep.
    before_sleep_cmd = sh -c '~/.config/hypr/scripts/save-before-sleep.sh; loginctl lock-session'

    # After real resume from suspend:
    # 1. ensure monitors are on (wlopm — AMD Polaris safe)
    # 2. restore monitor layout and exact floating window geometry
    after_sleep_cmd = sh -c 'wlopm --on "*" 2>/dev/null || true; ~/.config/hypr/scripts/restore-after-resume.sh'

    # Respect app/media/screen-share idle inhibitors.
    # false = DO respect inhibitors (default, correct).
    # Covers: Firefox, mpv, Steam, OBS, screen share, etc.
    # Also covers Waybar idle_inhibitor module (caffeine).
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false

    # Wait until hyprlock fully acquires the session lock
    # before allowing the system to actually sleep.
    # 3 = wait for wayland session-lock protocol confirmation.
    inhibit_sleep = 3
}

# ---------------------------------------------------------
# 5 min idle → lock screen
#
# Timeline:
#   5:00  → lock
#   7:00  → monitors off
#   20:00 → suspend
#
# Caffeine (Waybar idle_inhibitor or systemd-inhibit):
#   ALL three listeners below are blocked when active.
#   The system will not lock, will not turn off monitors,
#   and will not suspend for as long as caffeine is on.
#
# Note: no suspend is scheduled here.
# Suspend lives in its own listener (timeout = 1200).
# This avoids the systemd-run decoupling race condition
# where an external timer would fire regardless of caffeine.
# ---------------------------------------------------------
listener {
    timeout = 300

    on-timeout = loginctl lock-session
}

# ---------------------------------------------------------
# 7 min idle → turn monitors off via wlopm
#
# AMD RX 580 (Polaris) note:
#   wlopm --off is mandatory. Using hyprctl dispatch dpms off
#   triggers an amdgpu power state change that kills browser
#   GPU subprocesses and causes hyprlock crashes.
#
# This is NOT a suspend, so after_sleep_cmd does not run.
# We must therefore save window geometry here ourselves,
# and restore it explicitly on resume.
# ---------------------------------------------------------
listener {
    timeout = 420

    on-timeout = sh -c '~/.config/hypr/scripts/save-before-sleep.sh; wlopm --off "*"'

    on-resume  = sh -c 'wlopm --on "*" 2>/dev/null || true; ~/.config/hypr/scripts/restore-after-resume.sh'
}

# ---------------------------------------------------------
# 20 min idle → suspend
#
# By keeping suspend as a plain listener (not a systemd-run
# timer), caffeine properly blocks it along with lock and
# monitor-off. No external timer, no race conditions.
#
# before_sleep_cmd runs automatically on suspend —
# no need to call loginctl lock-session here.
# ---------------------------------------------------------
listener {
    timeout = 1200

    on-timeout = systemctl suspend
}
