# DimArch Sage theme for uosc.
# Colors come from the TERMINAL surface family — ghostty's background,
# shared with yazi/starship/swayimg: bg #171b1b, text #edeae4,
# accent #7fb89e. (Was #16161c and credited to "waybar + mako"; waybar is a
# translucent glass surface on a different base and mako is gone, replaced
# by swaync. Resynced to ghostty 2026-07-26.)
# Verified real option names/syntax against the actual upstream default
# uosc.conf (raw from github.com/tomasklaen/uosc), not guessed — comma-
# delimited key=value lists, not separate top-level keys.

# foreground/foreground_text: accent-colored elements (active slider gauge,
# hover states) and the text/icons drawn on top of them.
# background/background_text: panel backgrounds (controls bar, menu,
# tooltip) and the icons/text drawn on them — this is exactly what the old
# built-in OSC's buttons_color/timecode_color failed to apply.
color=foreground=7fb89e,foreground_text=171b1b,background=171b1b,background_text=edeae4,window_border=171b1b,curtain=171b1b

# A bit more rounded than the 4px default — closer to the macOS-ish feel
# that was asked for, without going full pill-shaped.
border_radius=8

# uosc already respects osd-font (set to Inter Variable in mpv.conf) —
# nothing to configure here for the font itself.

# Hide alongside mpv's own cursor-autohide (mpv.conf: cursor-autohide=3000),
# matching the show-on-hover behavior the built-in OSC had. This is a global
# override: once mpv's cursor auto-hides, uosc hides its ENTIRE UI with it
# (top bar, controls, timeline), regardless of any `*_persistency` setting
# below — confirmed live 2026-07-09 (see mpv.conf's cursor-autohide comment).
# NOTE: this timer only governs the "cursor idle while still over the
# window" case. Moving the cursor OFF the window entirely hides everything
# INSTANTLY instead, via a separate, unconditional code path in uosc's own
# lib/cursor.lua (`handle_mouse_pos` calling `cursor:leave()` the moment
# mpv's `mouse-pos` property reports `hover=false`) — this does not check
# the `autohide` option at all, so there is no config knob for a delay
# there. Confirmed live 2026-07-09 by reading cursor.lua directly. Fixing
# it would mean patching the vendor script (same maintenance cost as the
# top_bar_controls limitation below) — accepted as a known limitation.
autohide=yes

# QuickTime-style minimal control bar: menu on the left, prev/play-pause/next
# centered (two `space`s split the remaining width evenly, pulling this
# middle group toward the center), speed + mute + fullscreen on the right.
# uosc's own default `controls` list has NO play-pause button at all (relies
# on click-anywhere-to-toggle + the flash pause indicator) — added back
# explicitly since a persistent play/pause button is the whole point of the
# macOS-player look that was asked for.
# `<eof-reached>` swaps play-pause for a replay button once the file is fully
# watched — confirmed live 2026-07-09 that mpv's own end-of-file pause state
# left play-pause visually doing nothing there (nothing to play forward
# from), so this both restores a working action AND is the actual "add a
# replay button" ask. `eof-reached` is a real mpv property, valid as a
# uosc disposition per uosc.conf's own `{mpv_prop}` disposition doc.
# `command:{icon}:{command}` and multi-command `;` chaining both verified
# against upstream uosc.conf's element docs and mpv's input.rst respectively.
# `cycle:{icon}:{prop}:{val1}[={icon1}]/{val2}[={icon2}]` syntax verified
# against uosc.conf's own documented `fullscreen` example — same pattern
# used here for a mute button with a real icon swap (volume_up <-> volume_off).
# `speed:1` explicit scale overrides uosc's own default of 1.3x controls_size
# for this element specifically — without it the speed slider rendered
# visibly larger than every other button in the row. Confirmed live 2026-07-09.
# Volume: a +/- pair of `command:` buttons flanking the mute cycle button —
# `add volume <n>` is mpv's own standard property-step idiom (the same
# mechanism its default `/`/`*` volume keys use, per mpv.rst's own default
# keybind list), not guessed. Icons `remove`/`add` (generic minus/plus) used
# instead of a second `volume_down`/`volume_up` pair specifically to avoid
# two visually-identical speaker glyphs sitting right next to each other
# (the mute button already uses volume_up/volume_off for its own state).
controls=menu,space,prev,<!eof-reached>play-pause,<eof-reached>command:replay:seek 0 absolute exact ; set pause no?Replay,next,space,<video,audio>speed:1,gap,command:remove:add volume -5?Volume -5,cycle:volume_up:mute:no/yes=volume_off!?Mute,command:add:add volume 5?Volume +5,fullscreen

# Default controls_size=32/controls_margin=8 were tuned to sit above the
# stock 40px timeline. Against our much thinner 18px timeline (below) they
# read as oversized — shrunk proportionally.
controls_size=22
controls_margin=6

# The side-docked vertical volume slider (default: right) is redundant now
# that mute lives in the control bar above — one less always-competing UI
# element, closer to the "just an icon" macOS feel.
volume=none

# top_bar=always, NOT the default no-border. uosc's TopBar.lua only enables
# itself in `no-border` mode when `not state.border` is true, where
# `state.border` mirrors mpv's own `border` property — confirmed live
# 2026-07-09 via mpv's IPC socket (`get_property border`) that this reports
# `true` even with `border=no` set in mpv.conf. mpv's `--title-bar` option is
# explicitly documented as "Windows and X11 only"; `--border` carries no such
# disclaimer but behaves the same way in practice here — Wayland has no
# equivalent client-togglable concept, so the property never flips, and
# `no-border` mode can never enable itself on this platform no matter what
# proximity/persistency is set. `top_bar=always` sidesteps the broken
# detection entirely — and as a side effect draws real minimize/maximize/
# close buttons (top_bar_controls=right, still upstream's default), which is
# genuinely useful given this window has zero native decorations otherwise.
top_bar=always
# Shrunk from the 40px default to match the same proportional downsizing
# applied to controls_size/timeline_size above — at full size it read as
# disproportionately thick/wide next to the rest of the now-smaller UI.
top_bar_size=28

# top_bar_controls (minimize/maximize/close) intentionally left at the
# upstream default (all three, right-aligned) even though minimize is a
# no-op here (window-minimized isn't wired to anything in this Hyprland
# floating-only setup yet) and maximize duplicates the `fullscreen` button
# already in the bottom controls bar. TopBar.lua hardcodes all three
# buttons as a set — `top_bar_controls` only controls left/right placement
# or hiding ALL of them (`no`), not picking a subset. Fixing that would mean
# patching the vendor script directly, which breaks on the next `mpv-uosc`
# pacman update — decided against it 2026-07-09, keep as-is.

# Default proximity (in=40, out=120px) only starts fading the UI in once the
# cursor is already almost on top of it. Widened so moving the mouse anywhere
# over a normal-sized floating video window reveals the UI, closer to
# QuickTime's "hover anywhere" behavior, instead of requiring the cursor
# right on the control bar itself. Confirmed live 2026-07-09 with
# `controls_persistency=paused`/`timeline_persistency=paused` test renders
# (NOT `=always`, which is not a valid value for these options — the
# documented state list is paused/audio/image/video/idle/windowed/
# fullscreen only. An earlier round of "nothing renders" test results was
# this invalid value silently not forcing anything, compounded by the
# cursor-autohide interaction noted on `autohide` above).
proximity_in=100
proximity_out=500

# Timeline slimmed down from the 40px default and its separating border
# removed — at full size/opaque background it read as its own distinct strip
# stacked below the controls row rather than part of the same panel. Kept
# `timeline_style=line` (upstream's own default, already the leaner of the
# two available styles vs `bar`) — only shrank its footprint and matched its
# background opacity to the controls row below so hovering reveals what
# feels like one unified bar instead of two visually separate ones. Bumped
# 14->18: 14 read as too thin once seen next to the (now also shrunk)
# controls row. Confirmed live 2026-07-09.
timeline_size=18
timeline_border=0
# Defaults (for reference, from upstream uosc.conf):
# timeline=0.9,position=1,chapters=0.8,slider=0.9,slider_gauge=1,controls=0,
# speed=0.6,menu=1,submenu=0.4,border=1,title=1,tooltip=1,thumbnail=1,
# curtain=0.8,idle_indicator=0.8,audio_indicator=0.5,buffering_indicator=0.3,
# playlist_position=0.8,heatmap=0.4,pause_indicator=0.8
opacity=timeline=0.6,controls=0.6
