# DimArch OS — bound what systemd-coredump is allowed to spend on a crash.
#
# Deploy: install -m 644 -o root -g root dimarch-coredump.conf \
#                        /etc/systemd/coredump.conf.d/dimarch.conf
# Deployed by install/phases/03-base.sh (STEP 3). Takes effect immediately —
# systemd-coredump@.service reads this file per crash, no daemon-reload needed.
#
# Storage=none — do not keep dumps on disk. This does NOT stop the work: per
# coredump.conf(5), a core must be written out before a stack trace can be
# extracted, so the dump lands in /var/lib/systemd/coredump/ (unlinked temp
# file) regardless; Storage= only decides whether it stays there afterwards.
#
# ProcessSizeMax — the size above which a dump is not processed at all. This is
# the setting that actually caps resource use. Measured on this machine
# (`systemd-coredump@*.service ... memory peak` in the journal):
#   Electron/Obsidian, 2026-07-27:  22.4 GB and 22.7 GB, ~2.5 min each — froze
#                                   the machine both times
#   Telegram, same evening:         2.4-3.6 GB, 4-7 s — no visible impact
#   Zoom, 2026-08-14:               6 s, produced a readable Qt backtrace
# 2G sits above what well-behaved crashes cost and below the Electron class.
#
# Not set to 0 (which, with Storage=none, would disable coredump handling
# entirely per coredump.conf(5)): traces from ordinary processes are worth
# keeping — Hyprland is well under this ceiling, and DimArch debugging leans on
# its crashes. Electron traces are useless anyway without debug symbols
# (`#0 0x... n/a`), which is exactly the class this ceiling drops.
#
# ExternalSizeMax/JournalSizeMax are deliberately absent: they bound dumps being
# *saved*, which Storage=none already rules out. Setting them would be a no-op.

[Coredump]
Storage=none
ProcessSizeMax=2G
